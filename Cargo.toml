[package]
name = "repasta"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "repasta"

[dependencies]
iced = { version = "0.14", optional = true, default-features = false, features = ["advanced", "tiny-skia", "tokio", "x11", "wayland"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Seals saved history (AES-256-GCM) with a key kept in the Keychain.
ring = { version = "0.17", optional = true }
security-framework = { version = "3.7", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSApplication", "NSBitmapImageRep", "NSButton", "NSColor", "NSColorSpace", "NSControl", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSOpenPanel", "NSPanel", "NSPasteboard", "NSSavePanel", "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSDistributedNotificationCenter", "NSEnumerator", "NSGeometry", "NSNotification", "NSString", "NSURL", "NSUserDefaults"] }

[features]
desktop = ["dep:iced", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:ring", "dep:security-framework"]

[[bin]]
name = "repasta-desktop"
path = "src/desktop/main.rs"
required-features = ["desktop"]
